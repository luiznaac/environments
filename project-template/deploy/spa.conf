# nginx site for a frontend-only root image. The SPA is served from the static root; every path
# that is not a real file falls through to index.html so the client router owns it. A frontend-only
# project has no co-located backend, so there is no /api proxy here — point the client at its API
# base at build time (VITE_API_BASE) instead.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
