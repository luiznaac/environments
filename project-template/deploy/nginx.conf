# nginx site for a paired root image (a backend + the built SPA). The SPA is served from the
# static root; the client's API base is "/api" (the frontend build sets VITE_API_BASE=/api), so
# requests under /api are proxied to the backend on its in-container port with the prefix
# stripped. Every other path falls through to the SPA so the client router owns it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
