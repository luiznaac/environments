name: Tools tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# The family only targets Linux, so the tools suite runs on Linux alone (the Docker-compose
# fixtures cannot build on a Windows runner, and no lane is exercised there).
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tools test suite
        run: node --test "tools/*.test.mjs"
