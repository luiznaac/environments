name: Link check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs deliberately link into the sibling repos (../chameidor,
      # ../portfolio-2) that this template spawned. Only environments is
      # checked out here, so those links can never resolve in CI — exclude
      # them rather than leave the check permanently red. Match on the
      # path segment only: lychee tests the regex against the fully
      # resolved file:// URL, which differs between machines.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude-loopback
            --exclude 'chameidor/'
            --exclude 'portfolio-2/'
            "**/*.md"
          fail: true
