# Propagation manifest for the python scaffold — read by tools/template-check.mjs and
# tools/template-propagate.mjs. `entries` classifies each watched path (owned | pinned | merge |
# judgment), `instantiate` names the scaffold and `check` is the lane's fast check; the class
# semantics live in environments/AGENTS.md ("Propagation: manifests, template-check and
# template-propagate"). The watchlist is deliberately curated, not a full tree.
entries:
  .env.example: judgment
  # A lane's compose diverges structurally (extra services, volumes, deploy bits); a scaffold
  # change here is a porting judgment, never an overwrite.
  docker-compose.yml: judgment
  .pre-commit-config.yaml: judgment
  # A lane rewrites the guide for its project; a scaffold change here is a porting judgment.
  AGENTS.md: judgment
  # A lane hand-authors its own map; a scaffold change here is a porting judgment, never an overwrite.
  docs/code-map.md: judgment
  # The telemetry standard every lane is reviewed against; the scaffold owns the text.
  docs/observability.md: owned
  CODING_STANDARDS.md: owned
  # Telemetry source: scaffold-owned; the `template` path token maps to the lane package.
  src/template/application/telemetry.py: owned
  src/template/usecase/commons/request_context.py: owned
  src/template/usecase/commons/logging.py: owned
  src/template/usecase/health/telemetry.py: owned
  src/template/httpapi/configuration/telemetry.py: owned
  # Existing integration points: a lane adapts them to its own graph and frameworks.
  src/template/application/settings.py: judgment
  src/template/application/container.py: judgment
  src/template/application/boot.py: judgment
  src/template/httpapi/configuration/server.py: judgment
  src/template/httpapi/controller/health_controller.py: judgment
  src/template/gateway/configuration/http_client.py: judgment
  # The contract suite is a porting judgment: a lane adapts the assertions to its graph.
  tests/unit/test_telemetry.py: judgment
  tests/unit/test_logging_bridge.py: judgment
  tests/unit/test_health_telemetry.py: judgment
  tests/unit/test_telemetry_http.py: judgment
  tests/unit/test_architecture.py: judgment
  tests/fixtures.py: judgment
  tests/integration/test_telemetry_db.py: judgment
  # A lane's image and deploy bits are its own (access-log flag, stopwaitsecs, ports).
  Dockerfile: judgment
  pyproject.toml:
    class: merge
    sections:
      - tool.ruff
      - tool.ruff.lint
      - tool.mypy
      - tool.importlinter

# `poe check` is the repo's own fast gate: lint, format, types, layer contracts and unit tests
# (not the Docker-backed integration suite — that runs in CI on the PR).
check:
  command: uv run poe check

# Word-boundary token the scaffold uses as its own name; the creation tooling replaces it with
# the project name (covers `src/template/`, pyproject `name`/`packages`/`root_package`, the
# uvicorn target, Dockerfile and CI). template-check reuses it to normalize scaffold files
# against a project.
#
# `instantiate` is also the creation contract read by tools/new-project.mjs: the lane dir, the
# fast check, the files where the token is legitimately part of the scaffold (not a placeholder),
# and the convention values with their per-file literals for CLI overrides.
instantiate:
  name: template
  lane: backend
  check: uv run poe check
  values:
    db:
      replacements:
        docker-compose.yml:
          - MYSQL_DATABASE=template
        .env.example:
          - MYSQL__DATABASE=template
        mysql/init.sql:
          - USE template;
        src/template/application/settings.py:
          - 'database: str = "template"'
    port:
      default: "8080"
      replacements:
        .env.example:
          - HTTP_PORT={{value}}
          - GATEWAYS__APP__HOST=http://localhost:{{value}}
        src/template/application/settings.py:
          - "http_port: int = {{value}}"
        # The unit test that pins the canonical dev default.
        tests/unit/test_app_host.py:
          - "settings.http_port == {{value}}"
    mysqlPort:
      default: "3306"
      replacements:
        .env.example:
          - MYSQL__PORT={{value}}
        src/template/application/settings.py:
          - "port: int = {{value}}"
        # The host side of the publish mapping; the container side stays fixed at 3306.
        docker-compose.yml:
          - "MYSQL__PORT:-{{value}}}:3306"
        tests/unit/test_app_host.py:
          - "settings.mysql.port == {{value}}"
    image:
      # The override is the complete image reference (`luiznaac/<project>-python`).
      style: whole
      replacements:
        .github/workflows/docker-publish.yml:
          - luiznaac/template-python
