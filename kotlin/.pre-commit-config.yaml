repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master, --branch, main]

  - repo: local
    hooks:
      - id: test
        name: test (gradle)
        entry: sh -c './gradlew test'
        language: system
        files: '\.(kt|kts)$'
        pass_filenames: false
