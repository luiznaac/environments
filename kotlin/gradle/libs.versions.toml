[versions]

kotlinx-coroutines-version="1.10.2"
springframework = "6.2.11"
kotest = "5.9.1"
jackson = "2.20.0"
ktor = "3.3.1"
exposed = "1.0.0-rc-1"
opentelemetry = "1.67.0"
opentelemetry-instrumentation = "2.33.1-alpha"
logstash-logback-encoder = "8.1"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version = "2.2.20" }
kotlinx-coroutines-jdk8 = { module="org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref="kotlinx-coroutines-version" }
kotlinx-coroutines-core = { module="org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref="kotlinx-coroutines-version" }
kotlinx-datetime = { module="org.jetbrains.kotlinx:kotlinx-datetime", version="0.7.1" }

ktor-netty = { module="io.ktor:ktor-server-netty", version.ref = "ktor"}
ktor-core = { module="io.ktor:ktor-server-core", version.ref = "ktor"}
ktor-compression = { module="io.ktor:ktor-server-compression", version.ref = "ktor"}
ktor-cors = { module="io.ktor:ktor-server-cors", version.ref = "ktor"}
ktor-status-pages = { module="io.ktor:ktor-server-status-pages", version.ref = "ktor"}
ktor-content-negotiation = { module="io.ktor:ktor-server-content-negotiation", version.ref = "ktor"}
ktor-jackson = { module="io.ktor:ktor-serialization-jackson", version.ref = "ktor"}
ktor-server-test-host = { module="io.ktor:ktor-server-test-host", version.ref = "ktor"}
ktor-client-core = { module="io.ktor:ktor-client-core", version.ref = "ktor"}
ktor-client-cio = { module="io.ktor:ktor-client-cio", version.ref = "ktor"}
ktor-client-content-negotiation = { module="io.ktor:ktor-client-content-negotiation", version.ref = "ktor"}
ktor-client-mock = { module="io.ktor:ktor-client-mock", version.ref = "ktor"}

opentelemetry-api = { module="io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module="io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module="io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-exporter-logging = { module="io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module="io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-ktor = { module="io.opentelemetry.instrumentation:opentelemetry-ktor-3.0", version.ref = "opentelemetry-instrumentation" }
opentelemetry-runtime-telemetry = { module="io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry", version.ref = "opentelemetry-instrumentation" }
opentelemetry-logback-appender = { module="io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-instrumentation" }
logstash-logback-encoder = { module="net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

exposed-core = { module="org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module="org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module="org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-datetime = { module="org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-migration-core = { module="org.jetbrains.exposed:exposed-migration-core", version.ref = "exposed" }
exposed-migration-jdbc = { module="org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }

logback-classic = "ch.qos.logback:logback-classic:1.5.19"

spring-boot = { module = "org.springframework.boot:spring-boot", version = "3.5.6" }
spring-context = { module="org.springframework:spring-context", version.ref="springframework" }

snakeyaml = "org.yaml:snakeyaml:2.5"

jackson-kotlin = { module="com.fasterxml.jackson.module:jackson-module-kotlin", version.ref="jackson" }
jackson-jsr310 = { module="com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref="jackson" }

# Test dependencies
kotest-assertions-core = { module="io.kotest:kotest-assertions-core", version.ref="kotest" }
kotest-extensions-spring = { module="io.kotest.extensions:kotest-extensions-spring", version="1.3.0" }
kotest-runner-junit5 = { module="io.kotest:kotest-runner-junit5", version.ref="kotest" }
kotest-property-jvm = { module="io.kotest:kotest-property-jvm", version.ref="kotest" }

kotlinx-coroutines-test = { module="org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref="kotlinx-coroutines-version" }
mockk = "io.mockk:mockk:1.14.6"
spring-test = { module="org.springframework:spring-test", version.ref="springframework" }
spring-boot-starter-test = { module="org.springframework.boot:spring-boot-starter-test", version = "3.5.6" }
testcontainers = { module="org.testcontainers:testcontainers", version = "1.21.3" }
testcontainers-mysql = { module="org.testcontainers:mysql", version = "1.21.3" }
wiremock = "io.kotest.extensions:kotest-extensions-wiremock:3.1.0"

[bundles]
dependencies = [
    "logback-classic",
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-jdk8",
    "spring-context",
    "kotlinx-datetime",
]

testDependencies = [
    "mockk",
    "kotest-runner-junit5",
    "kotest-assertions-core",
    "kotest-property-jvm",
    "kotlinx-coroutines-test",
    "spring-test",
    "kotlinx-datetime",
]
