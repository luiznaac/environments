# Propagation manifest for the kotlin scaffold — read by tools/template-check.mjs and
# tools/template-propagate.mjs. `entries` classifies each watched path (owned | pinned | merge |
# judgment), `instantiate` names the scaffold and `check` is the lane's fast check; the class
# semantics live in environments/AGENTS.md ("Propagation: manifests, template-check and
# template-propagate"). The watchlist is deliberately curated, not a full tree.
entries:
  .env.example: judgment
  # A lane's compose diverges structurally (extra services, volumes, deploy bits); a scaffold
  # change here is a porting judgment, never an overwrite.
  docker-compose.yml: judgment
  .pre-commit-config.yaml: judgment
  # A lane rewrites the guide for its project; a scaffold change here is a porting judgment.
  AGENTS.md: judgment
  # A lane hand-authors its own map; a scaffold change here is a porting judgment, never an overwrite.
  docs/code-map.md: judgment
  CODING_STANDARDS.md: owned
  # A lane's Gradle build layout carries project-specific modules and dependencies; port by judgment.
  build.gradle.kts: judgment
  settings.gradle.kts: judgment
  config/detekt/config.yml: owned
  config/detekt/format.yml: owned
  # The wrapper's executable bit is part of the watched contract: `./gradlew` runs the lane.
  # `watch: mode` owns only the bit, so a lane keeps its own wrapper script and jar version.
  gradlew:
    class: owned
    watch: mode
  gradle/libs.versions.toml:
    class: pinned
    # No `pins` list: a version catalog compares every `[versions]` alias.
  # The integration harness is infrastructure each lane adapts (container image, stubs, helpers):
  # a scaffold change here is a porting judgment, never an overwrite.
  integrationTest/build.gradle.kts: judgment
  integrationTest/src/test/resources/application-test.yaml: judgment
  integrationTest/src/test/resources/mysql-test-conf/my.cnf: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/ClockMock.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/HttpMockService.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/HttpRequestService.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/IntegrationTest.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/KotestConfig.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/MySqlContainerExtension.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/ResetWiremock.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/StopKtorServer.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/tests/HarnessContractTest.kt: judgment
  integrationTest/src/test/kotlin/dev/agner/template/integrationTest/tests/MigrationSchemaTest.kt: judgment

# The verification ladder's first two rungs: compile first (allWarningsAsErrors makes the
# compiler the strictest gate), then detekt for the configs this manifest watches.
check:
  command: ./gradlew compileKotlin compileTestKotlin detekt

# Word-boundary token the scaffold uses as its own name; the creation tooling replaces it with
# the project name (covers `dev.agner.template`, `rootProject.name` and the docker-compose
# database name). template-check reuses it to normalize scaffold files against a project; files
# in `keep` are compared and propagated verbatim, never token-substituted.
#
# `instantiate` is also the creation contract read by tools/new-project.mjs: the lane dir, the
# fast check, the files where the token is legitimately part of the scaffold (not a placeholder),
# and the convention values with their per-file literals for CLI overrides. The token pass
# handles the rest: package names, `rootProject.name`, the DB name and the image.
instantiate:
  name: template
  lane: backend
  # `clean build` includes the Docker-backed integration suite, like CI.
  check: ./gradlew clean build
  keep:
    - .salgadinhos/manifest.yml
    - config/detekt/config.yml
    - gradlew
    - gradlew.bat
  values:
    db:
      replacements:
        .env.example:
          - MYSQL_DATABASE=template
        docker-compose.yml:
          - MYSQL_DATABASE=template
        application/src/main/resources/application.yaml:
          - MYSQL_DATABASE:template
        persistence/src/main/kotlin/dev/agner/template/persistence/migration/Migrator.kt:
          - '?: "template"'
        integrationTest/src/test/kotlin/dev/agner/template/integrationTest/config/MySqlContainerExtension.kt:
          - 'withDatabaseName("template")'
    port:
      default: "8080"
      replacements:
        .env.example:
          - KTOR_PORT={{value}}
        application/src/main/resources/application.yaml:
          - "port: ${KTOR_PORT:{{value}}}"
    mysqlPort:
      default: "3306"
      replacements:
        .env.example:
          - MYSQL_PORT={{value}}
        application/src/main/resources/application.yaml:
          - "port: ${MYSQL_PORT:{{value}}}"
        # The host side of the publish mapping; the container side stays fixed at 3306.
        docker-compose.yml:
          - "MYSQL_PORT:-{{value}}}:3306"
        # The standalone Flyway/migration fallback and the unit test that pins it.
        persistence/src/main/kotlin/dev/agner/template/persistence/configuration/MySqlEndpoint.kt:
          - DEFAULT_MYSQL_PORT = {{value}}
        persistence/src/test/kotlin/dev/agner/template/persistence/configuration/MySqlEndpointTest.kt:
          - shouldBe {{value}}
    image:
      # The override is the complete image reference (`luiznaac/<project>`).
      style: whole
      replacements:
        .github/workflows/docker-publish.yml:
          - luiznaac/template
